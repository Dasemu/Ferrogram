name: CI

# Pull requests run CI once (pull_request); pushes run only on the long-lived
# branches so a PR push does not trigger a duplicate run.
on:
  push:
    branches: [main, development]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev libssl-dev libasound2-dev cmake dbus gnome-keyring
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        # A private session bus lets the StatusNotifierItem test run; without
        # FERRO_REQUIRE_BUS it would silently skip.
        env:
          FERRO_REQUIRE_BUS: "1"
        run: dbus-run-session -- cargo test --all-targets

      # Real Secret Service: guards the zbus executor feature (tokio vs async-io)
      # that keyring's blocking connection depends on.
      - name: cargo test real_keyring (gnome-keyring on a private bus)
        env:
          FERRO_REAL_KEYRING: "1"
        run: |
          dbus-run-session -- sh -c 'echo | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --test real_keyring -- --ignored'
